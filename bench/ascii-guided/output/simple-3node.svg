<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 178 312" width="178" height="312">
<defs>
  <pattern id="dotgrid" width="8" height="8" patternUnits="userSpaceOnUse">
    <rect width="8" height="8" fill="#000000"/>
    <circle cx="4" cy="4" r="0.8" fill="#b4f079" opacity="0.7"/>
  </pattern>
  <pattern id="crosshatch" width="8" height="8" patternUnits="userSpaceOnUse">
    <rect width="8" height="8" fill="#000000"/>
    <path d="M0 8L8 0M-1 1L1 -1M7 9L9 7" stroke="#b4f079" stroke-width="0.8" opacity="0.2"/>
  </pattern>
  <pattern id="hero" width="6" height="6" patternUnits="userSpaceOnUse">
    <rect width="6" height="6" fill="#3d6b23"/>
    <circle cx="3" cy="3" r="0.6" fill="#5a9a35" opacity="0.5"/>
  </pattern>
  <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto" markerUnits="strokeWidth">
    <polygon points="0 0, 10 3.5, 0 7" fill="#b4f079"/>
  </marker>
  <marker id="arrowhead-reverse" markerWidth="10" markerHeight="7" refX="1" refY="3.5" orient="auto" markerUnits="strokeWidth">
    <polygon points="10 0, 0 3.5, 10 7" fill="#b4f079"/>
  </marker>
</defs>
<rect width="100%" height="100%" fill="#000000"/>
<g class="diagram">
<text x="30" y="34" font-family="'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="15" fill="#ffffff" font-weight="700">Simple 3-Node</text><text x="30" y="55" font-family="'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="15" fill="#ffffff" font-weight="700">Flow</text>
<line x1="89" y1="114" x2="89" y2="152" stroke="#b4f079" stroke-width="1.5" marker-end="url(#arrowhead)"/>
<line x1="89" y1="192" x2="89" y2="230" stroke="#b4f079" stroke-width="1.5" marker-end="url(#arrowhead)"/>

<circle cx="89" cy="82" r="32" fill="#000000" stroke="#b4f079" stroke-width="1.5"/><text x="89" y="82" font-family="'JetBrains Mono', 'Fira Code', 'SF Mono', 'Cascadia Code', monospace" font-size="13" fill="#b4f079" opacity="0.6" text-anchor="middle" dominant-baseline="central" letter-spacing="0.12em">START</text>
<rect x="36" y="152" width="106" height="40" rx="12" fill="#000000" stroke="#b4f079" stroke-width="1.5"/><text x="89" y="172" font-family="'JetBrains Mono', 'Fira Code', 'SF Mono', 'Cascadia Code', monospace" font-size="13" fill="#b4f079" opacity="0.6" text-anchor="middle" dominant-baseline="central" letter-spacing="0.12em">PROCESS</text>
<circle cx="89" cy="262" r="32" fill="#000000" stroke="#b4f079" stroke-width="1.5"/><text x="89" y="262" font-family="'JetBrains Mono', 'Fira Code', 'SF Mono', 'Cascadia Code', monospace" font-size="13" fill="#b4f079" opacity="0.6" text-anchor="middle" dominant-baseline="central" letter-spacing="0.12em">END</text>

</g>
</svg>